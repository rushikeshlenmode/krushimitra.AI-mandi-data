name: Fetch mandi prices

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-prices

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices
        run: python fetch_prices.py
        env:
          DATA_GOV_KEY: ${{ secrets.DATA_GOV_KEY }}
      - name: Save to repository
        run: |
          mkdir -p data
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -A data
                    git diff --cached --quiet || git commit -m "Update prices"
          git pull --rebase origin main
          git push
